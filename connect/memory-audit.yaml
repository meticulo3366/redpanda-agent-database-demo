# agent-memory-audit
#
# Materialises the CockroachDB changefeed on agent.memory.cdc into the
# append-only memory_audit table, so every memory write (insert, update,
# TTL delete) made by the Memory Concierge is kept as an immutable record.
#
# Contract: docs/DESIGN.md section 6. Written for Redpanda Connect 4.69.
#   lint : rpk connect lint --skip-env-var-check connect/memory-audit.yaml
#   test : rpk connect test connect/tests/memory-audit_test.yaml
#
# In Redpanda Cloud, REDPANDA_BROKERS is a contextual variable and the
# secrets.NAME interpolations resolve from the cluster secret store (scope
# SCOPE_REDPANDA_CONNECT). scripts/40-pipelines.sh uploads this file verbatim;
# with --local it renders a copy that reads plain environment variables
# (secrets.NAME -> NAME) and moves metrics/logger into the streams-mode root
# config. Note: the linter interpolates "dollar-brace" even inside comments,
# so comments here never spell that syntax out.

input:
  redpanda:
    seed_brokers: [ "${REDPANDA_BROKERS}" ]
    tls:
      enabled: true
    sasl:
      - mechanism: SCRAM-SHA-256
        username: "${secrets.AGENT_MEMORY_KAFKA_USER}"
        password: "${secrets.AGENT_MEMORY_KAFKA_PASSWORD}"
    topics: [ "agent.memory.cdc" ]
    consumer_group: agent-memory-audit
    start_offset: earliest
    commit_period: 1s

pipeline:
  processors:
    # One changefeed envelope in, one memory_audit row out (or nothing).
    # The envelope (verified) is {"after": {...}|null, "before": {...}|null,
    # "updated": "<hlc>"}; resolved markers are {"resolved": "<hlc>"}.
    - label: audit_row
      mapping: |
        # Resolved markers carry no row change: drop them. Anything without an
        # "updated" MVCC timestamp is not a row change either.
        root = if this.exists("resolved") || !this.exists("updated") {
          deleted()
        } else {
          {
            # memory_id is the Kafka message key: the primary key as a JSON
            # array, ["<uuid>"]. Fall back to the row if the key is missing or
            # unparseable (or() covers both a null result and an error).
            "memory_id": metadata("kafka_key").parse_json().index(0).or(
              this.after.memory_id.or(this.before.memory_id)
            ),
            # subject from after, else before (deletes only have before).
            "subject": this.after.subject.or(this.before.subject),
            "op": if this.before == null { "insert" } else if this.after == null { "delete" } else { "update" },
            # JSONB columns: pass the documents as JSON text ($4::jsonb, $5::jsonb).
            "before_doc": if this.before != null { this.before.string() } else { null },
            "after_doc": if this.after != null { this.after.string() } else { null },
            "updated_hlc": this.updated.string()
          }
        }
    # A malformed event must never poison a batch: log it and drop it.
    - catch:
        - log:
            level: ERROR
            message: 'agent-memory-audit: dropping malformed changefeed event: ${! error() }'
        - mapping: root = deleted()

output:
  sql_raw:
    driver: postgres
    dsn: "${secrets.AGENT_MEMORY_CRDB_DSN}"
    query: >-
      INSERT INTO memory_audit (memory_id, subject, op, before_doc, after_doc, updated_hlc)
      VALUES ($1,$2,$3,$4::jsonb,$5::jsonb,$6)
      ON CONFLICT (memory_id, updated_hlc) DO NOTHING
    # The row object is produced (and unit tested) by the audit_row processor
    # above; this mapping only reads its fields in column order.
    args_mapping: |
      root = [ this.memory_id, this.subject, this.op, this.before_doc, this.after_doc, this.updated_hlc ]
    max_in_flight: 2
    batching:
      count: 100
      period: 1s

# Service-wide fields (stripped by scripts/40-pipelines.sh --local, where they
# move into the streams-mode root config).
metrics:
  prometheus: {}

logger:
  level: INFO
